<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Trắc Nghiệm - Vật Lý Đại Cương 1 (Chương 5)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            background: #f1f5f9;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .option-item:hover:not(.disabled) {
            background: #e2e8f0;
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: #eff6ff;
        }
        .option-item.correct {
            background: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #166534;
        }
        .option-item.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }
        .option-item.disabled {
            cursor: default;
        }
        .explanation {
            background: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            display: none;
            font-size: 15px;
            line-height: 1.5;
            color: #1e3a8a;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        .jump-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .jump-box input {
            width: 60px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            color: var(--primary-color);
            font-size: 28px;
        }
        .img-wrapper {
            display: block;
            margin-top: 12px;
            text-align: center;
        }
        .img-wrapper img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VẬT LÝ ĐẠI CƯƠNG 1 - CƠ NHIỆT</h1>
    <div class="subtitle">Chương 5: Phương Trình Trạng Thái Khí Lý Tưởng (90 Câu - Đầy đủ đáp án & Lời giải)</div>

    <div id="quiz-screen">
        <div class="quiz-controls">
            <span id="question-counter">Câu 1 / 90</span>
            <div class="jump-box">
                <span>Đến câu:</span>
                <input type="number" id="jump-input" min="1" max="90" placeholder="1-90">
                <button style="padding: 6px 12px; font-size: 14px;" onclick="jumpToQuestion()">Đi</button>
            </div>
            <span id="score-tracker">Điểm: 0</span>
        </div>

        <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
        
        <ul class="options-list" id="options-container"></ul>

        <div class="explanation" id="explanation-box">
            <strong>💡 Giải thích chi tiết:</strong> <span id="explanation-text"></span>
        </div>

        <div class="btn-container">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Câu trước</button>
            <button id="next-btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
        </div>
    </div>

    <div class="score-card" id="score-card">
        <h2>Hoàn thành bài ôn tập Chương 5!</h2>
        <p id="final-score" style="font-size: 20px; margin: 20px 0;"></p>
        <button onclick="restartQuiz()">Làm lại từ đầu</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Câu 1. Hai bình chứa cùng một loại khí lý tưởng ở cùng nhiệt độ nhưng áp suất khác nhau. Động năng tịnh tiến trung bình của một phân tử khí trong hai bình",
            options: [
                "A. lớn hơn ở bình có áp suất cao.",
                "B. lớn hơn ở bình có áp suất thấp.",
                "C. bằng nhau.",
                "D. phụ thuộc vào thể tích bình."
            ],
            correct: 2,
            explain: "Động năng tịnh tiến trung bình của phân tử khí lý tưởng Wđ = (3/2)kT chỉ phụ thuộc vào nhiệt độ tuyệt đối T, không phụ thuộc áp suất hay thể tích."
        },
        {
            q: "Câu 2. Khi nhiệt độ tuyệt đối của một lượng khí lý tưởng tăng, động năng tịnh tiến trung bình của các phân tử",
            options: [
                "A. tăng.",
                "B. giảm.",
                "C. không đổi.",
                "D. chỉ tăng nếu thể tích không đổi."
            ],
            correct: 0,
            explain: "Vì Wđ = (3/2)kT nên khi nhiệt độ tuyệt đối T tăng thì động năng tịnh tiến trung bình của phân tử tăng tỉ lệ thuận."
        },
        {
            q: "Câu 3. Áp suất của khí lên thành bình có nguồn gốc vi mô chủ yếu từ",
            options: [
                "A. trọng lượng của các phân tử khí.",
                "B. sự va chạm của các phân tử khí với thành bình.",
                "C. lực hút giữa các phân tử khí.",
                "D. kích thước của bình chứa."
            ],
            correct: 1,
            explain: "Theo thuyết động học phân tử, áp suất khí tác dụng lên thành bình là kết quả của vô số va chạm đàn hồi của các phân tử khí lên mỗi đơn vị diện tích thành bình."
        },
        {
            q: "Câu 4. Khí thực có xu hướng gần với khí lý tưởng nhất khi",
            options: [
                "A. áp suất cao và nhiệt độ thấp.",
                "B. áp suất thấp và nhiệt độ cao.",
                "C. áp suất và nhiệt độ đều thấp.",
                "D. áp suất và nhiệt độ đều cao."
            ],
            correct: 1,
            explain: "Ở áp suất thấp và nhiệt độ cao, khoảng cách trung bình giữa các phân tử rất lớn nên thể tích riêng của phân tử và lực tương tác giữa chúng trở nên không đáng kể."
        },
        {
            q: "Câu 5. Trong mô hình khí lý tưởng, người ta xem",
            options: [
                "A. các phân tử có kích thước đáng kể và hút nhau mạnh.",
                "B. Thể tích riêng của các phân tử có thể bỏ qua; ngoài thời gian va chạm, tương tác giữa chúng được xem như không đáng kể; các va chạm giữa các phân tử và với thành bình là hoàn toàn đàn hồi.",
                "C. các phân tử đứng yên ở trạng thái cân bằng.",
                "D. mọi phân tử có cùng vận tốc."
            ],
            correct: 1,
            explain: "Đây là các giả thiết cơ bản định nghĩa mô hình khí lý tưởng trong cơ học thống kê và nhiệt động lực học."
        },
        {
            q: "Câu 6. Đối với một lượng khí lý tưởng cố định, phát biểu nào sau đây đúng?",
            options: [
                "A. Khi nhiệt độ tăng thì áp suất luôn tăng, không phụ thuộc thể tích.",
                "B. Khi giữ nhiệt độ T không đổi, tích pV không đổi.",
                "C. Khi giữ áp suất p không đổi, thể tích không phụ thuộc nhiệt độ.",
                "D. Áp suất của khí chỉ phụ thuộc vào số mol khí."
            ],
            correct: 1,
            explain: "Theo định luật Boyle-Mariotte (quá trình đẳng nhiệt T = const), tích p·V = nRT = hằng số."
        },
        {
            q: "Câu 7. Phương trình Van der Waals đối với 1 mol khí thực có dạng (p + a/V²)(V - b) = RT. Ý nghĩa vật lý của hai hiệu chỉnh a và b là",
            options: [
                "A. a biểu diễn thể tích riêng của phân tử, b biểu diễn lực tương tác giữa các phân tử.",
                "B. a biểu diễn ảnh hưởng của lực hút giữa các phân tử, b biểu diễn thể tích riêng hữu hạn của các phân tử.",
                "C. Cả a và b đều biểu diễn lực hút giữa các phân tử.",
                "D. a và b đều biểu diễn thể tích của bình chứa."
            ],
            correct: 1,
            explain: "Số hạng a/V² là áp suất nội tại gây ra bởi lực hút tương tác giữa các phân tử; hằng số b là cộng tích (thể tích riêng hiệu dụng) của 1 mol phân tử."
        },
        {
            q: "Câu 8. Một bình kín có thể tích không đổi chứa khí lý tưởng. Nếu một nửa số phân tử khí thoát ra ngoài, đồng thời nhiệt độ của lượng khí còn lại không đổi, thì áp suất trong bình",
            options: [
                "A. Tăng 2 lần.",
                "B. Giảm 2 lần.",
                "C. Không thay đổi.",
                "D. Giảm 4 lần."
            ],
            correct: 1,
            explain: "Theo công thức p = n₀·k·T, khi V và T không đổi mà số phân tử giảm một nửa thì mật độ phân tử n₀ giảm một nửa, dẫn đến áp suất p giảm 2 lần."
        },
        {
            q: "Câu 9. Chất khí gây áp suất lên thành bình chứa là do",
            options: [
                "A. Lực đẩy giữa các phân tử khí.",
                "B. Thể tích bình chứa quá nhỏ so với lượng khí.",
                "C. Các phân tử khí va chạm vào thành bình.",
                "D. Trọng lực của khối khí tác dụng lên đáy bình."
            ],
            correct: 2,
            explain: "Các phân tử chuyển động nhiệt hỗn loạn và va chạm liên tục vào thành bình tạo nên áp suất khí."
        },
        {
            q: "Câu 10. Khi nói về khí lí tưởng, phát biểu nào sau đây là không đúng?",
            options: [
                "A. Là khí mà thể tích các phân tử khí có thể bỏ qua.",
                "B. Là khí mà khối lượng các phân tử khí có thể bỏ qua.",
                "C. Là khí mà các phân tử chỉ tương tác với nhau khi va chạm.",
                "D. Khi va chạm với thành bình tạo nên áp suất."
            ],
            correct: 1,
            explain: "Phân tử khí lý tưởng được coi là chất điểm (bỏ qua kích thước/thể tích riêng) nhưng vẫn có khối lượng xác định để có động lượng và động năng."
        },
        {
            q: "Câu 11. Đối với một lượng khí lý tưởng xác định, khi nhiệt độ tăng và thể tích được giữ không đổi, áp suất của khí thay đổi như thế nào?",
            options: [
                "A. Áp suất giảm.",
                "B. Áp suất không đổi.",
                "C. Áp suất tăng.",
                "D. Áp suất tăng rồi giảm."
            ],
            correct: 2,
            explain: "Trong quá trình đẳng tích (V = const), áp suất tỉ lệ thuận với nhiệt độ tuyệt đối (p/T = const) nên nhiệt độ tăng thì áp suất tăng."
        },
        {
            q: "Câu 12. Hai bình chứa cùng một loại khí lý tưởng, có cùng thể tích và cùng số mol. Bình A ở 27°C, bình B ở 127°C. So sánh áp suất của hai bình.",
            options: [
                "A. P_A = P_B vì cùng loại khí.",
                "B. P_B > P_A vì nhiệt độ tuyệt đối của khí B lớn hơn.",
                "C. P_A > P_B vì nhiệt độ Celsius của A nhỏ hơn.",
                "D. Không thể so sánh áp suất nếu chưa biết khối lượng khí."
            ],
            correct: 1,
            explain: "Từ p = nRT/V, với cùng n và V, bình B có T_B = 400 K > T_A = 300 K nên áp suất P_B > P_A."
        },
        {
            q: "Câu 13. Một quả bóng bay được mang từ trong phòng ra ngoài trời lạnh. Giả sử lượng khí trong bóng không đổi và bóng có thể co giãn. Hiện tượng nào có khả năng xảy ra?",
            options: [
                "A. Bóng phồng to hơn vì áp suất khí bên trong giảm.",
                "B. Bóng co lại vì nhiệt độ khí giảm làm thể tích giảm nếu áp suất gần như không đổi.",
                "C. Bóng không thay đổi vì số mol khí không đổi.",
                "D. Bóng nổ vì nhiệt độ giảm."
            ],
            correct: 1,
            explain: "Quá trình gần đúng là đẳng áp (bằng áp suất khí quyển). Khi nhiệt độ giảm, theo định luật Gay-Lussac (V/T = const), thể tích khí giảm làm bóng co lại."
        },
        {
            q: "Câu 14. Một lượng khí lý tưởng được chứa trong một xilanh có pittông. Khi nén khí nhanh, thể tích khí giảm đáng kể. Nếu quá trình nén diễn ra nhanh đến mức khí chưa kịp trao đổi nhiệt đáng kể với môi trường, nhiệt độ của khí có xu hướng",
            options: [
                "A. Giảm vì thể tích giảm.",
                "B. Không đổi vì số mol khí không đổi.",
                "C. Tăng vì công của ngoại lực làm tăng nội năng của khí.",
                "D. Bằng 0 K vì khí bị nén."
            ],
            correct: 2,
            explain: "Đây là quá trình nén đoạn nhiệt (Q ≈ 0). Ngoại lực nén khí thực hiện công dương (A > 0), theo nguyên lý I (ΔU = A) nội năng tăng làm nhiệt độ khí tăng lên."
        },
        {
            q: "Câu 15. Theo mô hình khí lý tưởng, áp suất của khí trong bình chủ yếu có nguồn gốc từ",
            options: [
                "A. Trọng lượng của các phân tử khí.",
                "B. Lực hút tĩnh điện giữa các phân tử khí.",
                "C. Sự va chạm của các phân tử khí với thành bình.",
                "D. Thể tích riêng của các phân tử khí."
            ],
            correct: 2,
            explain: "Sự va chạm liên tục của các phân tử khí lên thành bình gây ra áp suất chất khí."
        },
        {
            q: "Câu 16. Nung nóng một bình kim loại kín, cứng chứa khí lý tưởng, đại lượng nào của khí sau đây tăng?",
            options: [
                "A. Khối lượng khí.",
                "B. Số phân tử khí.",
                "C. Áp suất khí.",
                "D. Khối lượng mỗi phân tử khí."
            ],
            correct: 2,
            explain: "Bình kín cứng nên V và số mol n không đổi. Nung nóng làm T tăng nên áp suất p tăng."
        },
        {
            q: "Câu 17. Một quả bóng bay mềm chứa khí, được buộc kín rồi đưa từ phòng ấm vào tủ lạnh. Coi áp suất bên ngoài gần như không đổi và vỏ bóng đủ mềm. Sau khi cân bằng nhiệt, bóng có xu hướng",
            options: [
                "A. Phồng to hơn.",
                "B. Nhỏ lại.",
                "C. Giữ nguyên thể tích.",
                "D. Mất hết áp suất bên trong."
            ],
            correct: 1,
            explain: "Áp suất không đổi, nhiệt độ giảm làm thể tích khối khí trong bóng giảm nên bóng nhỏ lại."
        },
        {
            q: "Câu 18. Hai bình chứa lần lượt khí helium và khí argon, cùng ở nhiệt độ. So sánh động năng tịnh tiến trung bình của một nguyên tử trong hai bình.",
            options: [
                "A. Helium lớn hơn.",
                "B. Argon lớn hơn.",
                "C. Bằng nhau.",
                "D. Không thể so sánh nếu chưa biết áp suất."
            ],
            correct: 2,
            explain: "Động năng tịnh tiến trung bình Wđ = (3/2)kT chỉ phụ thuộc vào nhiệt độ tuyệt đối T, không phụ thuộc khối lượng nguyên tử."
        },
        {
            q: "Câu 19. Một bình cứng, kín chứa khí lý tưởng. Nếu nhiệt độ của khí tăng từ 20°C lên 40°C, thì áp suất",
            options: [
                "A. Tăng 2 lần.",
                "B. Tăng 1,07 lần.",
                "C. Không đổi.",
                "D. Giảm 2 lần."
            ],
            correct: 1,
            explain: "Quá trình đẳng tích: p₂ / p₁ = T₂ / T₁ = (40 + 273) / (20 + 273) = 313 / 293 ≈ 1,068 (tức tăng 1,07 lần)."
        },
        {
            q: "Câu 20. Trong mô hình động học phân tử, áp suất khí tác dụng lên thành bình chủ yếu do",
            options: [
                "A. Trọng lượng của các phân tử đè lên đáy bình.",

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionCounter = document.getElementById("question-counter");
    const scoreTracker = document.getElementById("score-tracker");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const explanationText = document.getElementById("explanation-text");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreCard = document.getElementById("score-card");
    const finalScore = document.getElementById("final-score");
    const jumpInput = document.getElementById("jump-input");

    function loadQuestion() {
        answered = false;
        explanationBox.style.display = "none";
        nextBtn.disabled = true;
        prevBtn.disabled = currentQuestion === 0;

        const q = quizData[currentQuestion];
        questionCounter.innerText = `Câu ${currentQuestion + 1} / ${quizData.length}`;
        scoreTracker.innerText = `Điểm: ${score}`;
        questionText.innerHTML = q.q;
        jumpInput.value = currentQuestion + 1;

        optionsContainer.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(selectedIndex, element) {
        if (answered) return;
        answered = true;

        const q = quizData[currentQuestion];
        const options = optionsContainer.children;

        if (selectedIndex === q.correct) {
            element.classList.add("correct");
            score++;
        } else {
            element.classList.add("incorrect");
            options[q.correct].classList.add("correct");
        }

        for (let opt of options) {
            opt.classList.add("disabled");
        }

        scoreTracker.innerText = `Điểm: ${score}`;
        explanationText.innerText = q.explain;
        explanationBox.style.display = "block";
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    }

    function jumpToQuestion() {
        const val = parseInt(jumpInput.value);
        if (val >= 1 && val <= quizData.length) {
            currentQuestion = val - 1;
            loadQuestion();
        }
    }

    function showScore() {
        quizScreen.style.display = "none";
        scoreCard.style.display = "block";
        finalScore.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu. (Đạt ${(score/quizData.length*10).toFixed(1)} điểm)`;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        quizScreen.style.display = "block";
        scoreCard.style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>
